<ion-header>
  <ion-toolbar color="primary">
    <ion-title>✅ Tareas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nueva()">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="segmento">
      <ion-segment-button value="pendientes">Pendientes</ion-segment-button>
      <ion-segment-button value="completadas">Completadas</ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargar()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Skeleton -->
  @if (cargando) {
    <ion-list>
      @for (_ of [1,2,3,4]; track _) {
        <ion-item>
          <ion-skeleton-text animated style="height: 20px"></ion-skeleton-text>
        </ion-item>
      }
    </ion-list>
  }

  <!-- Lista de tareas -->
  @if (!cargando && tareas.length > 0) {
    <ion-list>
      @for (tarea of tareas; track tarea) {
        <ion-item-sliding>
          <app-tarjeta-tarea
            [tarea]="tarea"
            (seleccionada)="abrir($event)"
            (completar)="completar($event)"
          ></app-tarjeta-tarea>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="confirmarEliminar(tarea)">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <!-- Estado vacío -->
  @if (!cargando && tareas.length === 0) {
    <app-empty-state
      icono="checkmark-done-outline"
      titulo="Sin tareas pendientes"
      mensaje="Pulsa + para añadir una nueva tarea"
      labelAccion="Nueva tarea"
    ></app-empty-state>
  }

</ion-content>

<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button color="primary" (click)="nueva()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
